name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Rust CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: make build

      - name: Run tests
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
            make test
          else
            sudo make test
          fi

  Test-Asymmetric-Routing:
    needs: [ci]
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: make build

      - name: Install tcpdump and net-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tcpdump net-tools

      - name: Test asymmetric routing over IPv4 (--oiface)
        run: sudo ci/test-oiface-ipv4.sh

      - name: Test asymmetric routing over IPv6 (--oiface)
        run: sudo ci/test-oiface-ipv6.sh